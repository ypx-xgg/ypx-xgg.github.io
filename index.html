<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>我的个人主页</title>
  <style>
    /* 这里是网页的美化设置 */
    body {
      font-family: '微软雅黑', sans-serif;
      background: linear-gradient(135deg, #74ebd5 0%, #9face6 100%);     text-align: center; /* 文字居中 */
      padding: 50px;
    }
    h1 {
      color: #2c3e50; /* 大标题颜色 */
    }
    .卡片 {
      background-color: white; /* 卡片的背景是白色的 */
      padding: 30px;
      border-radius: 10px; /* 卡片变成圆角 */
      box-shadow: 0 4px 8px rgba(0,0,0,0.1); /* 加一点阴影，看起来有立体感 */
      max-width: 600px; /* 卡片的最大宽度 */
      margin: 0 auto; /* 让卡片在页面正中间 */
    }
    .图片 {
      width: 150px;
      height: 150px;
      border-radius: 50%; /* 把图片变成圆形 */
      object-fit: cover;
      margin-bottom: 20px;
    }
    .按钮 {
      display: inline-block;
      background-color: #3498db;  /* 平时是蓝色 */
      color: white;
      padding: 10px 20px;
      text-decoration: none; /* 去掉链接默认的下划线 */
      border-radius: 5px;
      margin-top: 20px;
      
      transition: all 0.3s ease; /* 加上这个，颜色变化就像动画一样丝滑 */

    }
.按钮:hover {
  background-color: #2ecc71; /* 鼠标放上去，变成鲜艳的绿色 */ */
  transform: translateY(-3px);  /*鼠标放上去时，按钮微微向上浮起*/
  box-shadow:  0  4px  10px  rgba(46,  204,  113,  0.3);/*加一点绿色的发光阴影 */
}

  </style>
</head>
<body>

  <!-- 网页里的内容都在这里 -->
  <div class="卡片">
    
    <!-- 这里是一张图片（我放了一张网上的占位图，你以后可以换成自己的） -->
    <img src="https://picsum.photos/200/200" alt="我的头像" class="图片">
    
    <h1>你好，我是 想哥哥</h1>
    <p>一个喜欢学习折腾新东西的人</p>
    <p>欢迎来到我的第一个个人网站！哈哈！我终于把它搞定了，非常感谢DeepSeek的帮助！</p >
    
    <h3>关于我：</h3>
    <p>喜欢折腾电脑、听歌、看电影，折腾些新玩意。</p >
    
    <!-- 这里是一个能点击的按钮链接 -->
    <a href="//www.douyin.com/qishui/playlist/7466629159607863347 " class="按钮" target="_blank">点我去 汽水音乐听歌</a >
    
  </div>

</body>
</html>
