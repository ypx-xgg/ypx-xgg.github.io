
<!DOCTYPE html>

<html>
  <head>
    <meta charset="UTF-8">
    <title>我的个人主页</title>
    <style>
     /* 这里是网页的美化设置 */
      body {
        font-family: '微软雅黑', sans-serif;
        background: white;     text-align: center; /* 文字居中 */
        padding: 50px;
      }
      h1 {
        color: #2c3e50; /* 大标题颜色 */
      }
      .卡片 {
        background-color:#d6eaf8; /* 卡片的背景是浅蓝色的 */
        padding: 30px;
        border-radius: 10px; /* 卡片变成圆角 */
        box-shadow: 0 4px 8px rgba(0,0,0,0.1); /* 加一点阴影，看起来有立体感 */
        max-width: 600px; /* 卡片的最大宽度 */
        margin: 0 auto; /* 让卡片在页面正中间 */
      }
       .图片 {
  width: 150px;
  height: 150px;
  border-radius: 50%;
  object-fit: cover;
  margin-bottom: 20px;
  /* 下面是呼吸发光的魔法 */
  animation: breathe 3s infinite alternate;
}
@keyframes breathe {
  0% { box-shadow: 0 0 10px rgba(52, 152, 219, 0.4); }
  100% { box-shadow: 0 0 30px rgba(52, 152, 219, 0.9); }
}
    .按钮 {
        display: inline-block;
        background-color: #3498db;  /* 平时是蓝色 */
        color: white;
        padding: 10px 20px;
        text-decoration: none; /* 去掉链接默认的下划线 */
        border-radius: 5px;
        margin-top: 20px;
      
        transition: all 0.3s ease; /* 加上这个，颜色变化就像动画一样丝滑 */

      }
  .按钮:hover {
    background-color: #2ecc71; /* 鼠标放上去，变成鲜艳的绿色 */ */
    transform: translateY(-3px);  /*鼠标放上去时，按钮微微向上浮起*/
    box-shadow:  0  4px  10px  rgba(46,  204,  113,  0.3);/*加一点绿色的发光阴影 */
  }

    </style>
 
  </head>

  <body id="main-body" >

    <!-- 网页里的内容都在这里 -->
    <div class="卡片"id=main-card>
    
      <!-- 这里是一张图片（我放了一张网上的占位图，你以后可以换成自己的） -->
      < img src="https://cdn.dbimg.app/WHEEClfP.jpg" alt="我的头像" class="图片">

       <h1 id="typewriter" style="color: #2c3e50; min-height: 40px;"></h1>

    
      <h1>你好，<span style="font-size:16px;">我是</span> <span style="color:#c8161d;"><b><i>想哥哥</i></b></span></h1>
      <p>一个喜欢学习折腾新东西的人</p >
       <p>喜欢折腾电脑、听歌、看电影，折腾些新玩意。</p >
       </div>

      <h2>欢迎来到我的第一个个人网站！</h2>
      <p>哈哈！我终于迈出了第一步,非常感谢DeepSeek的帮助！</p >
    
     

     <p id="today-date" style="color: #888; font-weight: bold;"></p >
              
      <!-- 这是一个时钟容器 -->
      <div style="margin-top: 20px; font-size: 24px; font-weight: bold; color: #2980b9;">
        当前时间：<span id="clock"></span>
      

      <!-- 这是让时钟动起来的代码 -->
      <script>
       function updateClock() {
          var now = new Date();
          var hours = String(now.getHours()).padStart(2, '0');
          var minutes = String(now.getMinutes()).padStart(2, '0');
          var seconds = String(now.getSeconds()).padStart(2, '0');
          document.getElementById('clock').innerText = hours + ":" + minutes + ":" + seconds;
        }
        setInterval(updateClock, 1000);
        updateClock();
      </script>
      <!-- 这里是一个能点击的按钮链接 -->
      <a href=" " class="按钮" target="_blank">点我去 汽水音乐听歌</a >
      <a href="//www.douyin.com/video/7647976629548895529 " class="按钮" target="_blank">点我去看红果短剧</a >

       <button onclick="toggleDarkMode()" style="margin-top: 20px; padding: 8px 15px; cursor: pointer;">切换暗黑模式</button>

      <!-- 鼠标拖尾星星特效 -->
<script>
  document.addEventListener('mousemove', function(e) {
    var star = document.createElement('div');
    star.innerHTML = '✨';
    star.style.position = 'absolute';
    star.style.left = e.pageX + 'px';
    star.style.top = e.pageY + 'px';
    star.style.fontSize = '20px';
    star.style.pointerEvents = 'none'; // 防止挡住你的点击
    star.style.transition = 'all 1s ease-out';
    document.body.appendChild(star);
    
    setTimeout(function() {
      star.style.transform = 'translateY(50px) scale(0)';
      star.style.opacity = '0';
    }, 10);
    
    setTimeout(function() {
      star.remove();
    }, 1000);
  });
</script>
     </div>

<script>
  function toggleDarkMode() {
    var body = document.getElementById('main-body');
    var card = document.getElementById('main-card');
    
    // 如果背景现在是白色的，就变成黑色；否则变回原来的
    if (body.style.backgroundColor !== 'black') {
      body.style.backgroundColor = 'black';
      body.style.backgroundImage = 'none'; // 取消原来的渐变色
      card.style.backgroundColor = '#2c3e50';
      card.style.color = 'white';
    } else {
      body.style.backgroundColor = ''; // 恢复默认
      body.style.backgroundImage = ''; 
      card.style.backgroundColor = 'white';
      card.style.color = '#333';
    }
  }
</script>

<script>
  // 1. 显示今天日期
  var date = new Date();
  var year = date.getFullYear();
  var month = date.getMonth() + 1;
  var day = date.getDate();
  var weekDay = ["星期日", "星期一", "星期二", "星期三", "星期四", "星期五", "星期六"][date.getDay()];
  document.getElementById('today-date').innerText = "今天是 " + year + "年" + month + "月" + day + "日 " + weekDay;

  // 2. 打字机效果
  var text = "你好，我是 想哥哥"; 
  var index = 0;
  var typewriterElement = document.getElementById('typewriter');
  
  function typeText() {
    if (index < text.length) {
      typewriterElement.innerText += text.charAt(index);
      index++;
      setTimeout(typeText, 200); // 每个字间隔200毫秒，想快一点就把200改成100
    }
  }
  typeText();
</script>
